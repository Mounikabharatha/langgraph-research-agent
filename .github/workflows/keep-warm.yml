name: Keep the demo warm

# Streamlit Community Cloud sleeps an app nobody visits, and waking it takes
# 30-60 seconds. That cold start lands on whoever opens the link from the CV.
#
# A plain HTTP request does NOT prevent it: fetching the URL only returns the
# hosting shell served by share.streamlit.io, which renders the real app in an
# iframe. The container starts only when a client opens the websocket, so this
# loads the page in a real browser and waits for the app itself to render.

on:
  schedule:
    # Hourly. The log line from each run says how long the load took, so if
    # a run ever reports a cold start the interval is too long - tighten it.
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: keep-warm
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install playwright

      # The browser download is the slow part of this job, and it does not
      # change between runs.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      # A no-op when the cache restored it. The system libraries live outside
      # the cached directory, so they are always installed.
      - name: Install Chromium
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Open the app and wait for it to render
        env:
          APP_URL: https://langgraph-research-assistant.streamlit.app
        run: python .github/scripts/keep_warm.py
